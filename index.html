<html>
<head>
<style>
body {

h1, p {
  background-color: black;
  color: white;
  
   }

  font-family: 'Brush Script MT', cursive;
}
</style>
</head>
<body>

 <h1 align="center">Golf Lesson</h1>
 <p align="center">The site that learns the best</p>
 
<a href="games.html" target="_blank">
<button class="games" role="button">Games</button>

<style>
.games {
  appearance: button;
  background-color: #1899D6;
  border: solid transparent;
  border-radius: 16px;
  border-width: 0 0 4px;
  box-sizing: border-box;
  color: #FFFFFF;
  cursor: pointer;
  display: inline-block;
  font-family: brush script mt,cursive;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .8px;
  line-height: 20px;
  margin: 0;
  outline: none;
  overflow: visible;
  padding: 13px 16px;
  text-align: center;
  text-transform: uppercase;
  touch-action: manipulation;
  transform: translateZ(0);
  transition: filter .2s;
  user-select: none;
  -webkit-user-select: none;
  vertical-align: middle;
  white-space: nowrap;
  width: 100%;
}

.games:after {
  background-clip: padding-box;
  background-color: #1CB0F6;
  border: solid transparent;
  border-radius: 16px;
  border-width: 0 0 4px;
  bottom: -4px;
  content: "";
  left: 0;
  position: absolute;
  right: 0;
  top: 0;
  z-index: -1;
}

.games:main,
.games:focus {
  user-select: auto;
}

.games:hover:not(:disabled) {
  filter: brightness(1.1);
  -webkit-filter: brightness(1.1);
}

.games:disabled {
  cursor: auto;
}

.games:active {
  border-width: 4px 0 0;
  background: none;
}

body {
  background-color: black;
}



</body>
</html>
